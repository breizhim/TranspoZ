name: GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: |
          npm test
          python -m pytest -q
      - name: Construction du site statique
        run: ./scripts/build-pages.sh
        env:
          # Variable de dépôt facultative : Settings → Secrets and variables → Actions → Variables
          OMR_API_URL: ${{ vars.OMR_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Déploie uniquement depuis la branche par défaut du dépôt.
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
